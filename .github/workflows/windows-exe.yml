name: Windows Portable

# Windows-only PORTABLE build (no installer): publishes just the Windows projects
# and assembles the portable layout (NAPS2.Portable.exe launcher + App/ + Data/).
# NOTE: we deliberately do NOT use `n2 build zip`, because building the full
# solution also builds NAPS2.App.Mac, which needs the `macos` workload that
# isn't available on Windows runners (NETSDK1147).
# Download the zip from the run's Artifacts, extract, and run NAPS2.Portable.exe.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish app + console (win-x64, ZIP/portable build)
        run: |
          dotnet publish NAPS2.App.WinForms -r win-x64 -c Release --self-contained true /p:DebugType=None /p:DebugSymbols=false /p:DefineConstants=ZIP -o portable/App
          dotnet publish NAPS2.App.Console -r win-x64 -c Release --self-contained true /p:DebugType=None /p:DebugSymbols=false /p:DefineConstants=ZIP -o portable/App

      - name: Publish worker (win-x86 single file, ZIP/portable build)
        run: dotnet publish NAPS2.App.Worker -c Release /p:DebugType=None /p:DebugSymbols=false /p:DefineConstants=ZIP -o portable/worker

      - name: Build portable launcher
        run: |
          dotnet build NAPS2.App.PortableLauncher -c Release --nologo
          Copy-Item NAPS2.App.PortableLauncher/bin/Release/net462/NAPS2.Portable.exe portable/ -Force

      - name: Assemble portable layout
        shell: pwsh
        run: |
          Copy-Item portable/worker/NAPS2.Worker.exe portable/App/ -Force
          if (Test-Path portable/App/_win32/naps2_jpeg.dll) { Copy-Item portable/App/_win32/naps2_jpeg.dll portable/App/ -Force }
          New-Item -ItemType Directory -Path portable/Data -Force | Out-Null
          Copy-Item LICENSE portable/license.txt -Force

      - name: Trim unused framework files (mirrors excludeDlls in NAPS2.Tools PackageCommand)
        shell: pwsh
        run: |
          $excludes = @('Microsoft.VisualBasic','System.Data','System.Private.DataContract','System.Windows.Forms.Design','D3D','Presentation','Reach','System.Windows.Controls.Ribbon','System.Windows.Input','System.Windows.Presentation','System.Xaml','UIAutomation','WindowsBase','wpfgfx','createdump','Microsoft.DiaSymReader','mscordaccore','mscordbi')
          function Is-Excluded($name) { foreach ($e in $excludes) { if ($name.StartsWith($e)) { return $true } } return $false }
          # Remove trimmed entries from deps.json so it matches the files on disk
          Get-ChildItem portable/App/*.deps.json | ForEach-Object {
            $deps = Get-Content $_.FullName -Raw | ConvertFrom-Json -Depth 100
            foreach ($targetProp in $deps.targets.PSObject.Properties) {
              foreach ($libProp in $targetProp.Value.PSObject.Properties) {
                foreach ($section in @('runtime','resources','native')) {
                  $secProp = $libProp.Value.PSObject.Properties | Where-Object { $_.Name -eq $section }
                  if ($secProp) {
                    foreach ($k in @($secProp.Value.PSObject.Properties.Name)) {
                      if (Is-Excluded ($k.Split('/')[-1])) { $secProp.Value.PSObject.Properties.Remove($k) }
                    }
                  }
                }
              }
            }
            $deps | ConvertTo-Json -Depth 100 | Set-Content $_.FullName -NoNewline
          }
          # Delete the trimmed files from disk
          Get-ChildItem portable/App/*.exe | Where-Object { $_.Name -ne 'NAPS2.Worker.exe' -and (Is-Excluded $_.Name) } | Remove-Item -Force
          Get-ChildItem portable/App/*.dll | Where-Object { Is-Excluded $_.Name } | Remove-Item -Force
          Get-ChildItem portable/App -Directory | Where-Object { $_.Name -match '^[a-z]{2}(-[A-Za-z]+)?$' } | Get-ChildItem -Filter *.resources.dll | Where-Object { Is-Excluded $_.Name } | Remove-Item -Force

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path portable/* -DestinationPath NAPS2-portable-win-x64.zip -Force

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: NAPS2-portable-win-x64
          path: NAPS2-portable-win-x64.zip
          if-no-files-found: error
