name: Windows Portable

# Windows-only PORTABLE build (no installer): produces the official portable zip
# (NAPS2.Portable.exe launcher + App/ + Data/) via the repo's own NAPS2.Tools.
# Use this while redesigning / adding features; other platforms are skipped for now.
# Download the zip from the run's Artifacts, extract, and run NAPS2.Portable.exe.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-windows-portable:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build (Release-Zip config)
        run: dotnet run --project NAPS2.Tools -- build zip -v

      - name: Package portable zip (no signing)
        run: dotnet run --project NAPS2.Tools -- pkg zip -p win64 --nosign -v

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: NAPS2-portable-win-x64
          path: NAPS2.Setup/publish/**/naps2-*-win-x64.zip
          if-no-files-found: error
